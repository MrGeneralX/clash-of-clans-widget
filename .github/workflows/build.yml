name: Build & Release Clash Timers APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Public Release
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "ClashTimers-${RELEASE_VERSION}.apk"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Clash Timers ${{ inputs.version || github.ref_name }}
          body: |
            Live Clash of Clans Home Screen Widget for Android.

            **How to install:**
            1. Download the `.apk` file below and install it.
            2. Add the **Clash Timers** widget to your home screen.
            3. In Clash of Clans, go to **Settings → More Settings → Data Export → Copy**, then tap **↻ Sync** on the widget.
          files: ClashTimers-*.apk
